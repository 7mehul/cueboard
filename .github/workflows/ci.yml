name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Every generated board keeps every rule
        run: node scripts/scale.ts --n 20000 --edge 0.3 --fuzz-model
      - name: The app builds
        run: node scripts/build-app.ts

  # `npx cueboard`, packed once and run on each Node someone might have.
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Pack it
        run: mkdir -p "$RUNNER_TEMP/pkg" && npm pack --pack-destination "$RUNNER_TEMP/pkg"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install it in a fresh folder and run it on Node ${{ matrix.node }}
        run: CUE_TARBALL=$(ls "$RUNNER_TEMP"/pkg/cueboard-*.tgz) scripts/check-package.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The image builds
        run: docker build -t cueboard .
      - name: It doesn't run as root, won't start without a password, and asks for it
        run: scripts/check-image.sh cueboard
