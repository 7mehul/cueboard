name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Every generated board keeps every rule
        run: node scripts/scale.ts --n 20000 --edge 0.3 --fuzz-model
      - name: The app builds
        run: node scripts/build-app.ts
