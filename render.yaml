# Render Blueprint for the hosted test version: New → Blueprint, pick this repo.
# Render asks for the values marked sync: false; CUE_SECRET is generated for you.
services:
  - type: web
    name: cueboard
    runtime: docker
    plan: 0.5c-512mb       # Starter, about $7 a month. Free instances sleep when idle and can't keep the usage log
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CUE_INVITES   # from: node scripts/invite.ts maya ben --url https://<your app>.onrender.com
        sync: false
      - key: CUE_ADMINS    # your own invite name, to see /admin
        sync: false
      - key: CUE_SECRET
        generateValue: true
      - key: CUE_DAILY_CALLS
        value: "150"
      - key: CUE_DAILY_TOTAL
        value: "1000"
      - key: CUE_DATA_DIR
        value: /data
    disk:
      name: cueboard-data
      mountPath: /data
      sizeGB: 1
