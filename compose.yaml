# Cueboard on your own server:
#   cp .env.example .env     then set CUE_PASSWORD and ANTHROPIC_API_KEY in it
#   docker compose up -d
# It answers on this machine's port 5180 only. Put a web server with HTTPS in front of it (README
# "Self-hosting" has a two-line Caddy setup), or reach it over an SSH tunnel or a private network.
services:
  cueboard:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Where it listens inside the container; these win over anything in .env.
      CUE_HOST: 0.0.0.0
      PORT: "5180"
      CUE_DATA_DIR: /data
    ports:
      - "127.0.0.1:5180:5180"
    volumes:
      - cueboard-data:/data

volumes:
  cueboard-data:
